name: Construir y publicar app (macOS)

# Construye la app de escritorio en la nube (no en el Mac del usuario) y publica
# el .dmg como GitHub Release. Se dispara al empujar una etiqueta vX.Y.Z, o a mano.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. v1.0.1) para una build manual"
        required: false

permissions:
  contents: write # necesario para crear el Release

jobs:
  build-mac:
    runs-on: macos-latest # runner de macOS disponible para el repo
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar uv (Python)
        uses: astral-sh/setup-uv@v5

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Construir el frontend (React)
        working-directory: desktop/frontend
        run: |
          npm install
          npm run build

      - name: Compilar el shell de Electron (TypeScript)
        working-directory: desktop/electron
        run: |
          npm install
          npm run build

      - name: Congelar el backend (PyInstaller)
        run: |
          uv sync --group build
          uv run --group build pyinstaller desktop/build/backend.spec \
            --noconfirm \
            --distpath desktop/build/dist \
            --workpath desktop/build/work

      - name: Empaquetar la app (.dmg)
        working-directory: desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sin firma (gratis)
        run: npx electron-builder --mac --publish never

      - name: Publicar el Release con el .dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            desktop/electron/release/*.dmg
            desktop/electron/release/*.zip
          generate_release_notes: true
