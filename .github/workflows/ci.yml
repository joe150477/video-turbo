name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run python -m compileall app cli.py main.py webui test

      - name: Run deterministic unit tests
        run: >
          uv run python -X utf8 -m unittest
          test.services.test_state test.services.test_task test.services.test_schema test.services.test_webui_i18n
          test.services.test_setup test.services.test_voice_catalog test.services.test_updates
          test.services.test_branding
          test.utils.test_error_messages test.controllers.test_system test.config.test_config_secrets

      - name: Lint desktop-app backend additions
        run: >
          uv run ruff check
          app/services/setup.py app/services/voice_catalog.py app/services/updates.py
          app/utils/error_messages.py app/controllers/v1/system.py

      - name: Type-check desktop-app backend additions
        run: >
          uv run mypy --ignore-missing-imports --follow-imports=silent
          app/services/setup.py app/services/voice_catalog.py app/services/updates.py
          app/utils/error_messages.py app/controllers/v1/system.py
